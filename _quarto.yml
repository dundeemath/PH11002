project:
  type: "book"
  output-dir: docs
  resources:
    - rubric-problem-solving.pdf
    - rubric-writing.pdf
    - rubric-presentation.pdf

book: 
  title: "Problem Solving and Professional Skills"
  author: 
    - "Dr Eric Hall"
    - "Dr Paula Stella Teixeira"
  description: |
     Notes for PH11002 - Problem Solving and Professional Skills, 
     a first year module about problem solving at 
     the University of Dundee.
  site-url: https://dundeemath.github.io/PH11002
  repo-url: https://github.com/dundeemath/PH11002/
  repo-branch: master
  cover-image: assets/images/cover_small.jpg
  cover-image-alt: "Wanderer above the Sea of Fog (Caspar David Friedrich, c. 1818)."
  downloads: pdf
  repo-actions: [issue]
  date: last-modified
  date-format: iso
  page-footer: "Copyright 2025, Eric Hall (University of Dundee)" 
  page-navigation: true
  search: true
  chapters: 
    - "index.qmd"
    - part: "Problem Solving"
      chapters:
        - "01-purpose.qmd"
        - "02-problems.qmd"
        - "03-heuristics.qmd"
        - "04-attitudes.qmd"
        - "05-meta-reflection.qmd"
    - part: "Professional Skills"
      chapters:
        - "11-academic-integrity.qmd"
        - "12-teamwork.qmd"
        - "13-technical-writing.qmd"
        - "14-presentations.qmd"
        - "15-ethics.qmd"
    - "99-references.qmd"
  appendices: 
    - appendix-rubrics.qmd
  # margin-header: "Header Text"
  sidebar:
    alignment: left
    footer: |
      <div style="padding-top: 0.3rem; padding-left: 0;">
        <img src="assets/images/uod_shield_rgb.png" alt="University of Dundee shield" style="width: 150px; display: block; margin: 0.0rem 0;"/>
      </div>
    # footer: |
    #   Last modified: {{< meta date >}}

bibliography:
  - ph11002.bib

prefer-html: true
  
format: 
  html: 
    theme: 
      light: flatly
      dark: darkly
    code-tools: true
    code-background: true
    code-fold: show
    code-copy: true
    code-overflow: wrap
    toc: true
    html-math-method: katex
    include-in-header: header.qmd
    number-sections: true
    number-depth: 2
  pdf: 
    code-overflow: wrap
    documentclass: scrreprt
    papersize: a4
    include-in-header: preamble.tex
    classoption: oneside
    keep-tex: true
    pdf-engine: xelatex
    latex-auto-install: false
    citation_method: natbib
    link-citations: true
    link-bibliography: true
    cover-image: assets/images/cover_small.jpg
    number-sections: true
    number-depth: 2
    mermaid:
      mermaid-format: svg
      theme: neutral
      themeVariables:
        fontSize: "10px"
    
execute: 
  freeze: auto
    
